<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>DIY Photobooth — V1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">DIY PHOTOBOOTH</div>
        <h1>Snap. Strip. Share.</h1>
      </div>
      <span class="badge">V1</span>
    </header>

    <section class="booth">
      <div class="camera-card">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="captureCanvas" aria-hidden="true"></canvas>
        <div id="flash" class="flash"></div>
        <div id="countdown" class="countdown" aria-live="assertive"></div>

        <div id="cameraPlaceholder" class="placeholder">
          <div class="placeholder-icon">📷</div>
          <h2>Camera ready?</h2>
          <p>Allow camera access to start your photobooth.</p>
        </div>
      </div>

      <div class="controls">
        <div class="status-row">
          <span id="status" class="status">Camera not started</span>
          <button id="switchCamera" class="icon-btn" type="button" title="Switch camera" disabled>↔</button>
        </div>

        <button id="startBtn" class="primary" type="button">Start Camera</button>

        <div class="settings">
          <label>
            Photos
            <select id="photoCount">
              <option value="3" selected>3 photos</option>
              <option value="4">4 photos</option>
            </select>
          </label>
          <label>
            Countdown
            <select id="delay">
              <option value="3" selected>3 sec</option>
              <option value="5">5 sec</option>
              <option value="1">1 sec</option>
            </select>
          </label>
        </div>
      </div>
    </section>

    <section id="resultSection" class="result hidden">
      <div class="section-heading">
        <div>
          <div class="eyebrow">YOUR STRIP</div>
          <h2>Looks good?</h2>
        </div>
        <button id="retakeBtn" class="secondary" type="button">Retake</button>
      </div>

      <div class="result-wrap">
        <img id="resultImage" alt="Generated photobooth strip">
      </div>

      <div class="result-actions">
        <button id="downloadBtn" class="primary" type="button">Download PNG</button>
      </div>
      <p class="privacy">Your photos are processed on this device. Nothing is uploaded.</p>
    </section>

    <footer>Built DIY • No account • No server • No paid API</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
